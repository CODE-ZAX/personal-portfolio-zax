services:
  portfolio:
    image: faraz-portfolio
    build:
      context: .
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - web

  pocketbase:
    image: faraz-pocketbase
    build:
      context: ./pocketbase
    restart: unless-stopped
    command:
      [
        "pocketbase",
        "serve",
        "--http=0.0.0.0:8090",
        "--dir=/pb_data",
        "--migrationsDir=/pb_migrations",
        "--hooksDir=/pb_hooks",
      ]
    environment:
      DOCKER_PROXY_URL: http://docker-socket-proxy:2375
    volumes:
      - pb_data:/pb_data
      - ./pocketbase/pb_migrations:/pb_migrations:ro
      - ./pocketbase/pb_hooks:/pb_hooks:ro
      - /proc:/host/proc:ro
      - /:/host/root:ro
    expose:
      - "8090"
    networks:
      web:
        priority: 100
      socket:
        priority: 10

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      # The image binds [::]:2375 by default. That socket does not accept IPv4
      # on hosts with IPv6 disabled, so PocketBase never reaches the proxy.
      DISABLE_IPV6: "1"
      CONTAINERS: "1"
      INFO: "1"
      POST: "0"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      CONTAINERS_CREATE: "0"
      DISTRIBUTION: "0"
      EVENTS: "0"
      EXEC: "0"
      GRPC: "0"
      IMAGES: "0"
      NETWORKS: "0"
      NODES: "0"
      PING: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VERSION: "0"
      VOLUMES: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket

networks:
  web:
  socket:
    internal: true

volumes:
  pb_data:
